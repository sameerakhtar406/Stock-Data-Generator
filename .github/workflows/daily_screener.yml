name: Daily Market Screener

on:
  schedule:
    - cron: '0 13 * * 1-5'  # 6:30 PM IST (Mon-Fri)
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy jugaad-data yfinance python-dateutil requests

      - name: Execute Screener & Send Email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python screener.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flagged_stocks.csv
          git commit -m "Auto-update flagged stocks: $(date +'%Y-%m-%d')" || exit 0
          git push
