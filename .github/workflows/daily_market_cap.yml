name: Daily Market Cap Screener

on:
  schedule:
    # Runs at 8:30 PM IST (Mon-Fri)
    # This is 2 hours after your primary daily_screener.yml (which runs at 13:00 UTC / 6:30 PM IST)
    - cron: '0 15 * * 1-5'  
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  run-market-cap-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy jugaad-data yfinance python-dateutil requests

      - name: Execute Market Cap Screener
        run: python market_cap_screener.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_cap_results.csv
          # The exit 0 ensures the workflow doesn't fail if the CSV hasn't changed
          git commit -m "Auto-update market cap screener: $(date +'%Y-%m-%d')" || exit 0
          git push
